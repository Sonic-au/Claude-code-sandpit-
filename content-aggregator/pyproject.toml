[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-aggregator"
version = "0.1.0"
description = "Topic-based content aggregator with AI scoring"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",

    # HTTP & scraping
    "httpx>=0.27.0",
    "feedparser>=6.0.0",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",

    # Social media
    "praw>=7.7.0",
    "tweepy>=4.14.0",

    # YouTube
    "google-api-python-client>=2.140.0",

    # Email ingestion
    "aioimaplib>=1.1.0",
    "aiosmtplib>=3.0.0",

    # AI
    "anthropic>=0.40.0",

    # Scheduler
    "apscheduler>=4.0.0a5",

    # Config
    "pydantic-settings>=2.5.0",

    # Utils
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aggregator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
