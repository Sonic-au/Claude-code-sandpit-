# Technical-manual corpus (default). Use case: technician Q&A with page citations.
#
# Source PDFs are NOT committed. `python -m tenderbench fetch` downloads each one, checks its
# SHA-256 and builds the bench PDF from the listed pages. `pages` are 1-based page numbers in
# the ORIGINAL document; all gold annotations use them.

documents:
  - id: xylem_empa
    title: "Xylem e-MPA / e-MPR / e-MPD Horizontal Multi-Stage Pump - Instruction Manual IM309 Rev 0"
    publisher: Xylem
    kind: manual
    category: equipment-om
    url: https://prod.xylem.com/siteassets/brand/xylem/e-mpa-e-mpr-e-mpd-horizontal-multi-stage-pump-im309.pdf
    sha256: 3864f4fc8f7aacb0bf5543ab60cda89325415f6d60c723f7d811d2ad890dc094
    # Safety, storage, installation precautions, coupling torque table, power connection,
    # commissioning steps, maintenance, troubleshooting cause/remedy tables.
    pages: [5, 6, 8, 12, 19, 26, 28, 31, 32, 34, 35]

  - id: postgresql_backup
    title: "PostgreSQL 17 Documentation - Chapter 25 Backup and Restore (A4 PDF)"
    publisher: The PostgreSQL Global Development Group (PostgreSQL Licence)
    kind: manual
    category: software
    url: https://www.postgresql.org/files/documentation/pdf/17/postgresql-17-A4.pdf
    sha256: 7581578f7e96d3061bac20d6a6cf0097ae4a156efc7f39fdf8769c63f331efa3
    # SQL dump and restore, pg_dumpall, large databases, WAL archiving, base backup steps.
    pages: [823, 824, 825, 826, 829, 833, 834]
    notes: 3,100-page manual; only the backup chapter pages are used.

  - id: ti_lm317
    title: "Texas Instruments LM317 3-Pin Adjustable Regulator datasheet (SLVS044Z)"
    publisher: Texas Instruments
    kind: manual
    category: specification
    url: https://www.ti.com/lit/ds/symlink/lm317.pdf
    sha256: 1646fb2e4f8cf8c2cbd93aaf22edad368571619ad062476deca8ee29f95c65d3
    # Features, device comparison, pin functions, absolute maximum ratings, electrical
    # characteristics, functional description, design procedure, power and thermal guidance.
    pages: [1, 4, 5, 6, 8, 13, 16, 23, 24]
    notes: TI revises datasheets; a checksum mismatch means re-check the gold before updating.

  - id: faa_ac43
    title: "FAA AC 43.13-1B (with Change 1) - Chapter 7 Aircraft Hardware, Safetying, Control Cables"
    publisher: US Federal Aviation Administration (public domain)
    kind: manual
    category: aviation
    url: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf
    sha256: 8dc99dd41334381b287ae02d03dc29928d9eacb1035b67aa24c5a0525324ee73
    # Torque procedure, Table 7-1 recommended torque values, bolts, self-locking nut torque
    # table, safetying rules, cable construction table.
    pages: [318, 319, 321, 322, 324, 328, 330, 337]

  - id: army_tm_tqg
    title: "US Army TM 9-6115-639-13 - 3 kW Tactical Quiet Generator Set (MEP-831A/832A) operator, unit and DS maintenance"
    publisher: US Departments of the Army, Air Force and Marine Corps (Distribution A, public release)
    kind: manual
    category: defence
    url: https://www.radionerds.com/images/9/96/TM-9-6115-639-13.pdf
    sha256: 02da33376ab2b6b93b6c871afbf8a1eefa8069daadf4d7325180fa0d96bfb5ac
    # Warning summary, equipment data tables, controls table, PMCS table, operating and
    # starting procedures with warnings/cautions, hand starting, troubleshooting tables.
    pages: [4, 29, 30, 46, 55, 67, 68, 69, 73, 78, 79]
    notes: Third-party mirror of a Distribution A manual (official source - Army Publishing Directorate).

  - id: army_tm_scan
    title: "US Army TM 9-6115-639-13 - PMCS, start-up and troubleshooting pages as a simulated scan"
    kind: manual
    category: defence
    derived_from: army_tm_tqg
    pages: [55, 69, 78, 79]
    transform: {type: scan, dpi: 150, rotate_deg: 0.5, noise_sigma: 6, jpeg_quality: 55, seed: 11}
    notes: Image-only copy; gold is shared with army_tm_tqg so OCR is scored against exact truth.
