<title>Manual Handling Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* Layout: a workbench - manuals rail on the left, one working area with three tabs (pages, test questions, ask and label). */
  :root {
    --bg: #eef1f4; --panel: #ffffff; --sunk: #f5f7f9; --ink: #141a22; --muted: #586474; --line: #d6dce4;
    --accent: #b45309; --accent-ink: #ffffff; --accent-soft: #fdf1e3;
    --ok: #1d7a46; --ok-soft: #e4f4ea; --warn: #9a6400; --warn-soft: #fbf1d9; --bad: #b42318; --bad-soft: #fdecea;
    --mark: #ffe2a8;
    --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --r: 8px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #11151b; --panel: #181e26; --sunk: #141920; --ink: #e6ebf1; --muted: #9aa6b5; --line: #2b3440;
    --accent: #f59e0b; --accent-ink: #1a1206; --accent-soft: #2e2210;
    --ok: #5cc98a; --ok-soft: #13291d; --warn: #e7b450; --warn-soft: #2c2310; --bad: #f07a6e; --bad-soft: #321716;
    --mark: #5a4210; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #11151b; --panel: #181e26; --sunk: #141920; --ink: #e6ebf1; --muted: #9aa6b5; --line: #2b3440;
    --accent: #f59e0b; --accent-ink: #1a1206; --accent-soft: #2e2210;
    --ok: #5cc98a; --ok-soft: #13291d; --warn: #e7b450; --warn-soft: #2c2310; --bad: #f07a6e; --bad-soft: #321716;
    --mark: #5a4210; color-scheme: dark; }

  body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
  * { box-sizing: border-box; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; max-width: 1440px; margin: 0 auto; display: grid; gap: 16px; }
  header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  header.top h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  header.top p { margin: 0; color: var(--muted); font-size: 13px; }
  .layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } .layout > .rail { display: none; } .rail-select { display: flex !important; } }

  .rail { display: grid; gap: 6px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
  .rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 4px 2px; font-weight: 500; }
  .rail button { text-align: left; background: transparent; border: 1px solid transparent; border-radius: var(--r); padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
  .rail button:hover { background: var(--panel); border-color: var(--line); }
  .rail button[aria-current="true"] { background: var(--panel); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .rail .t { font-weight: 500; font-size: 13px; line-height: 1.3; }
  .rail .m { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
  .rail-select { display: none; gap: 8px; align-items: center; }
  .wrap > *, .layout > * { min-width: 0; }
  .rail-select select { flex: 1; min-width: 0; width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); }

  .work { display: grid; gap: 12px; min-width: 0; }
  .doc-head { display: grid; gap: 4px; }
  .doc-head h2 { margin: 0; font-size: 18px; font-weight: 600; text-wrap: balance; }
  .doc-head .sub { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }

  /* Pages */
  .strip { display: flex; gap: 4px; flex-wrap: wrap; }
  .strip button { font-family: var(--font-mono); font-size: 12px; min-width: 44px; padding: 4px 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .strip button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .strip button.has-q::after { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-left: 5px; vertical-align: 2px; opacity: .7; }
  .viewer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 1100px) { .viewer { grid-template-columns: minmax(0, 1fr); } }
  .pane { display: grid; gap: 8px; align-content: start; min-width: 0; }
  .pane-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .page-img { width: 100%; max-width: 100%; height: auto; border: 1px solid var(--line); border-radius: 4px; background: #fff; display: block; }
  .parsed { border: 1px solid var(--line); border-radius: 4px; background: var(--sunk); padding: 12px 14px; max-height: 1100px; overflow: auto; font-size: 13px; line-height: 1.55; }
  .parsed h4, .parsed h5 { margin: 12px 0 4px; font-size: 14px; font-weight: 600; }
  .parsed h5 { font-size: 13px; }
  .parsed p { margin: 6px 0; }
  .parsed ul { margin: 6px 0; padding-left: 20px; }
  .parsed pre { font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .parsed .tbl { overflow-x: auto; margin: 8px 0; }
  .parsed table { border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  .parsed td, .parsed th { border: 1px solid var(--line); padding: 3px 6px; vertical-align: top; }
  .parsed th { background: var(--panel); font-weight: 600; }
  .parsed .img { color: var(--muted); font-style: italic; font-size: 12px; }
  mark.sig { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 2px; font-weight: 600; }
  .page-qs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }

  /* Questions */
  .summary { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .qlist { display: grid; gap: 10px; }
  .q { border: 1px solid var(--line); border-radius: var(--r); background: var(--panel); padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
  .q.flash { box-shadow: 0 0 0 2px var(--accent); }
  .q-top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .q-top .id { font-family: var(--font-mono); }
  .q-q { font-weight: 500; font-size: 14px; }
  .q-grid { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 4px 12px; font-size: 13px; }
  @media (max-width: 560px) { .q-grid { grid-template-columns: minmax(0, 1fr); } .q-grid dt { margin-top: 6px; } }
  .q-grid dt { color: var(--muted); font-size: 12px; }
  .q-grid dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 500; border: 1px solid transparent; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); }
  .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); }
  .pill.plain { color: var(--muted); border-color: var(--line); }
  .pill.new { color: var(--accent); border-color: var(--accent); }
  .pg { font-family: var(--font-mono); font-size: 12px; border: 1px solid var(--line); background: var(--sunk); border-radius: 4px; padding: 0 6px; cursor: pointer; font-variant-numeric: tabular-nums; }
  .pg.hit { border-color: var(--ok); color: var(--ok); }
  .pages-inline { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; }

  /* Ask and label */
  .ask { display: grid; gap: 12px; }
  .ask textarea, .ask input[type=text], .ask input[type=number], .ask select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); padding: 8px 10px; }
  .ask textarea { min-height: 64px; resize: vertical; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .extract { border-left: 3px solid var(--line); padding: 4px 0 4px 10px; display: grid; gap: 2px; font-size: 13px; }
  .extract .h { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .extract .x { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .extract.open .x { display: block; }
  .answer { background: var(--sunk); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; min-height: 44px; }
  .answer.waiting { color: var(--muted); font-style: italic; }
  .form { display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .form label.f { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  .form .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .checks label { display: inline-flex; gap: 4px; align-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--ink); }
  .note { font-size: 12px; color: var(--muted); }
  .note.err { color: var(--bad); }
  .note.ok { color: var(--ok); }
  .empty { color: var(--muted); padding: 16px; text-align: center; border: 1px dashed var(--line); border-radius: var(--r); }
  /* Knowledge graph */
  .gwrap { display: grid; grid-template-columns: 250px minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
  @media (max-width: 1180px) { .gwrap { grid-template-columns: minmax(0, 1fr); } }
  .gcol { display: grid; gap: 10px; min-width: 0; align-content: start; }
  .gcol input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--sunk); padding: 8px 10px; }
  .gcanvas { border: 1px solid var(--line); border-radius: var(--r); background: var(--sunk); position: relative; overflow: hidden; touch-action: none; }
  .gcanvas canvas { display: block; width: 100%; height: 560px; cursor: grab; }
  .gcanvas .hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
  .glist { display: grid; gap: 2px; max-height: 300px; overflow: auto; }
  .glist button { text-align: left; background: none; border: 0; border-radius: 4px; padding: 4px 6px; cursor: pointer; font-size: 13px; display: flex; gap: 6px; align-items: baseline; }
  .glist button:hover { background: var(--sunk); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .gdetail { border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; background: var(--panel); max-height: 760px; overflow: auto; }
  .gdetail h3 { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .gdetail .grp { display: grid; gap: 4px; }
  .gdetail .grp > b { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
  .gdetail .quote { font-size: 12px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .legend .chip { display: inline-flex; gap: 5px; align-items: center; }
  h3.sec { margin: 4px 0 0; font-size: 14px; font-weight: 600; }
  @media (prefers-reduced-motion: no-preference) { .q.flash { transition: box-shadow .4s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <div><h1>Manual Handling Workbench</h1><p style="margin:2px 0 0"><b style="color:var(--ink);font-weight:500">Let AI handle your manuals.</b> <i>The right answer, on the right page.</i></p></div>
    <p id="meta">Loading manuals…</p>
  </header>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Manuals"></nav>
    <div class="work">
      <div class="rail-select"><label for="doc-select" class="note">Manual</label><select id="doc-select"></select></div>
      <div class="doc-head" id="doc-head"></div>
      <div class="tabs" role="tablist" aria-label="Views">
        <button role="tab" id="tab-pages" data-tab="pages" aria-selected="true">Pages</button>
        <button role="tab" id="tab-questions" data-tab="questions" aria-selected="false">Test questions</button>
        <button role="tab" id="tab-ask" data-tab="ask" aria-selected="false">Ask and label</button>
        <button role="tab" id="tab-graph" data-tab="graph" aria-selected="false" hidden>Knowledge graph</button>
      </div>
      <section class="panel" id="view-pages" role="tabpanel" aria-labelledby="tab-pages"></section>
      <section class="panel" id="view-questions" role="tabpanel" aria-labelledby="tab-questions" hidden></section>
      <section class="panel" id="view-ask" role="tabpanel" aria-labelledby="tab-ask" hidden></section>
      <section class="panel" id="view-graph" role="tabpanel" aria-labelledby="tab-graph" hidden></section>
    </div>
  </div>
</div>

<script>
(() => {
  const S = { data: null, doc: null, tab: 'pages', page: null, filter: 'all', flashQ: null,
              labels: [], db: null, sample: null, userId: null, dbState: 'connecting', sampleState: 'connecting',
              ask: { q: '', extracts: [], answer: '', cited: [], status: 'idle', ctl: null, error: '' } };
  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) n.append(k instanceof Node ? k : String(k));
    return n;
  };
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const doc = () => S.data.manuals.find((m) => m.id === S.doc);
  const shortTitle = (m) => m.title.replace(/\s*\(.*?\)\s*/g, ' ').split(' - ')[0].trim() + (m.id.endsWith('_scan') ? ' (scan)' : '');

  // ---------------------------------------------------------------- grades
  const gradeOf = (q) => {
    if (!q.answerable) return (q.claude_answer || '').trim().toUpperCase().startsWith('NOT FOUND') ? 'abstained' : 'answered_unanswerable';
    if ((q.claude_answer || '').trim().toUpperCase().startsWith('NOT FOUND')) return 'not_found';
    return q.grade_final || 'ungraded';
  };
  const GRADE = {
    correct: ['ok', 'Correct'], partial: ['warn', 'Partial'], incorrect: ['bad', 'Incorrect'],
    not_found: ['bad', 'Not found'], abstained: ['ok', 'Correctly said not found'],
    answered_unanswerable: ['bad', 'Answered an unanswerable question'], ungraded: ['plain', 'Not graded']
  };
  const pill = (g) => { const [c, t] = GRADE[g] || ['plain', g]; return el('span', { class: 'pill ' + c, text: t }); };

  // ---------------------------------------------------------------- parsed page text, rendered safely
  const SIG = /\b(DANGER|WARNING|CAUTION|NOTICE|IMPORTANT|NOTE)\b/g;
  const inline = (s) => {
    s = s.replace(/\*\*(.+?)\*\*/g, '$1').replace(/(^|\s)_(\S.*?\S|\S)_(?=\s|$|[.,;:])/g, '$1$2').replace(/\\([\\`*_{}\[\]()#+\-.!|<>])/g, '$1');
    const out = []; let last = 0; let m;
    SIG.lastIndex = 0;
    while ((m = SIG.exec(s))) { out.push(s.slice(last, m.index), el('mark', { class: 'sig', text: m[0] })); last = m.index + m[0].length; }
    out.push(s.slice(last));
    return out;
  };
  const htmlTable = (src) => {
    const t = new DOMParser().parseFromString(src, 'text/html').querySelector('table');
    if (!t) return el('p', {}, inline(src.replace(/<[^>]+>/g, ' ')));
    const table = el('table');
    for (const tr of t.querySelectorAll('tr')) {
      const row = el('tr');
      for (const c of tr.querySelectorAll('th,td')) {
        const cell = el(c.tagName.toLowerCase(), {}, inline(c.textContent.trim()));
        for (const a of ['colspan', 'rowspan']) if (c.getAttribute(a)) cell.setAttribute(a, String(parseInt(c.getAttribute(a), 10) || 1));
        row.append(cell);
      }
      table.append(row);
    }
    return el('div', { class: 'tbl' }, table);
  };
  const pipeTable = (lines) => {
    const table = el('table'); let first = true;
    for (const l of lines) {
      if (/^\s*\|?\s*:?-{2,}/.test(l)) continue;
      const cells = l.trim().replace(/^\||\|$/g, '').split('|');
      table.append(el('tr', {}, cells.map((c) => el(first ? 'th' : 'td', {}, inline(c.trim())))));
      first = false;
    }
    return el('div', { class: 'tbl' }, table);
  };
  const renderParsed = (md) => {
    const box = el('div', { class: 'parsed' });
    if (!md || !md.trim()) { box.append(el('p', { class: 'img', text: 'The parser returned no text for this page.' })); return box; }
    const parts = md.split(/(<table[\s\S]*?<\/table>|```[\s\S]*?```)/i);
    for (const part of parts) {
      if (!part.trim()) continue;
      if (/^<table/i.test(part.trim())) { box.append(htmlTable(part)); continue; }
      if (part.startsWith('```')) { box.append(el('pre', { text: part.replace(/^```\w*\n?|```$/g, '') })); continue; }
      for (const block of part.split(/\n\s*\n/)) {
        const b = block.trim(); if (!b) continue;
        const lines = b.split('\n');
        const h = b.match(/^(#{1,6})\s+(.*)$/);
        if (h && lines.length === 1) { box.append(el(h[1].length <= 2 ? 'h4' : 'h5', {}, inline(h[2]))); continue; }
        if (b === '<!-- image -->') { box.append(el('p', { class: 'img', text: '[image]' })); continue; }
        if (lines.every((l) => /^\s*\|/.test(l))) { box.append(pipeTable(lines)); continue; }
        if (lines.every((l) => /^\s*([-*+•]|\d+[.)])\s+/.test(l))) {
          box.append(el('ul', {}, lines.map((l) => el('li', {}, inline(l.replace(/^\s*([-*+•]|\d+[.)])\s+/, ''))))));
          continue;
        }
        const p = el('p');
        lines.forEach((l, i) => { if (i) p.append(el('br')); const hh = l.match(/^#{1,6}\s+(.*)$/); p.append(...inline(hh ? hh[1] : l)); });
        box.append(p);
      }
    }
    return box;
  };

  // ---------------------------------------------------------------- search (BM25 over the parsed chunks, title and heading prefixed)
  const tok = (s) => (s.toLowerCase().match(/[a-z0-9]+(?:[.%][0-9]+)?/g) || []);
  const indexes = new Map();
  const bm25 = (m) => {
    if (indexes.has(m.id)) return indexes.get(m.id);
    const docs = m.chunks.map((c) => tok(`${m.title} | ${c.heading} | ${c.text}`));
    const df = new Map(); docs.forEach((d) => new Set(d).forEach((t) => df.set(t, (df.get(t) || 0) + 1)));
    const N = docs.length, avg = docs.reduce((a, d) => a + d.length, 0) / Math.max(1, N);
    const idf = new Map(); let sum = 0;
    for (const [t, n] of df) { const v = Math.log((N - n + 0.5) / (n + 0.5)); idf.set(t, v); sum += v; }
    const floor = 0.25 * (sum / Math.max(1, idf.size));
    for (const [t, v] of idf) if (v < 0) idf.set(t, floor);
    const tfs = docs.map((d) => { const f = new Map(); d.forEach((t) => f.set(t, (f.get(t) || 0) + 1)); return f; });
    const ix = { docs, tfs, idf, avg };
    indexes.set(m.id, ix); return ix;
  };
  const search = (m, q, k = 5) => {
    const ix = bm25(m), qt = tok(q), k1 = 1.5, b = 0.75;
    const scores = ix.tfs.map((f, i) => qt.reduce((s, t) => {
      const tf = f.get(t) || 0; if (!tf) return s;
      return s + (ix.idf.get(t) || 0) * (tf * (k1 + 1)) / (tf + k1 * (1 - b + b * ix.docs[i].length / ix.avg));
    }, 0));
