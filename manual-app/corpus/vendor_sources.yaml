# Sources of gold that is independent of our own annotators (`python -m manual_app vendor`).

sources:
  # The vendor publishes the manual as HTML: code blocks, headings, notices and heading order become rules.
  - doc: postgresql_backup
    kind: html_manual
    prefix: pgv
    urls:
      - https://www.postgresql.org/docs/17/backup.html
      - https://www.postgresql.org/docs/17/backup-dump.html
      - https://www.postgresql.org/docs/17/continuous-archiving.html

  # The vendor's product page lists parameters independently of the datasheet.
  - doc: ti_lm317
    kind: spec_page
    prefix: tiv
    product: LM317
    url: https://www.ti.com/product/LM317

  # TechManualQA-700 (Duricic et al., CC BY 4.0, Zenodo record 17410809): external questions for three manuals.
  - doc: tmqa_makita_drill
    kind: techmanualqa
    prefix: tmk
    tmqa_doc: makita_drill.pdf
  - doc: tmqa_prusa_mk4
    kind: techmanualqa
    prefix: tpr
    tmqa_doc: prusa_3d-printer.pdf
  - doc: tmqa_dji_mavic_pro
    kind: techmanualqa
    prefix: tdj
    tmqa_doc: dji_mavic_pro.pdf
