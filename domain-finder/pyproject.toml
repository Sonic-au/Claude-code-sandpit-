[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-finder"
version = "0.1.0"
description = "AI startup domain name generator and availability checker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "anthropic>=0.40.0",
    "pydantic-settings>=2.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
